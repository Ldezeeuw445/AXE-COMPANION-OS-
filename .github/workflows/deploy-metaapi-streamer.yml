name: Deploy MetaAPI Streamer

on:
  push:
    branches:
      - main
      - axe-companion-runtime-foundation
    paths:
      - "node/metaapi-streamer/**"
      - "Dockerfile.streamer"
      - ".github/workflows/deploy-metaapi-streamer.yml"

concurrency:
  group: deploy-metaapi-streamer
  cancel-in-progress: true

jobs:
  deploy:
    name: Railway streamer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli@4.6.3

      - name: Redeploy linked service
        if: ${{ secrets.RAILWAY_TOKEN != '' && vars.RAILWAY_STREAMER_SERVICE_ID != '' }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway redeploy --service "${{ vars.RAILWAY_STREAMER_SERVICE_ID }}" --yes
