name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main
      - axe-companion-runtime-foundation
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deploy-supabase-functions.yml"
  workflow_dispatch:

concurrency:
  group: deploy-supabase-functions
  cancel-in-progress: true

jobs:
  deploy:
    name: Supabase intel-proxy
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy intel-proxy
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_REF != '' }}
        run: |
          supabase functions deploy intel-proxy \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt \
            --use-api

      - name: Skip notice (missing secrets)
        if: ${{ env.SUPABASE_ACCESS_TOKEN == '' || env.SUPABASE_PROJECT_REF == '' }}
        run: |
          echo "::warning::Skipping deploy — set SUPABASE_ACCESS_TOKEN secret and SUPABASE_PROJECT_REF variable (pqnngpcgbdwxavbatbia)."
