name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  statuses: write

jobs:
  check:
    name: lint-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx eslint src/lib/chart src/app/api/chart/session/route.ts src/app/api/chart/live/route.ts src/components/chart/useLiveChart.ts src/instrumentation.ts
      - run: npm test
      - run: npm run build

  # Vercel GitHub App still posts "Account is blocked" because the old project
  # is linked. Production is IONOS. Overwrite that commit status so it cannot
  # block review of this repo.
  ignore-vercel:
    name: ignore-vercel-status
    runs-on: ubuntu-latest
    steps:
      - name: Mark Vercel unused
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 20
          SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          gh api "repos/${{ github.repository }}/statuses/${SHA}" \
            -f state=success \
            -f context=Vercel \
            -f description="Unused — production is IONOS (www.axecompanion.com)" \
            -f target_url="https://www.axecompanion.com"
