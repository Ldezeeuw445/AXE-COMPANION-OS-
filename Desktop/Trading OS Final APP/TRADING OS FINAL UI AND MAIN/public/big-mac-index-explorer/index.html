<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Big Mac Index — Currency Valuation Explorer</title>
<meta name="description" content="Interactive world map showing currency over/undervaluation based on The Economist's Big Mac Index">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <!-- Lucide `Cpu` icon (same mark as Trading OS sidebar BIGMAC INDEX) -->
        <svg class="logo cpu-logo" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 20v2"/>
          <path d="M12 2v2"/>
          <path d="M17 20v2"/>
          <path d="M17 2v2"/>
          <path d="M2 12h2"/>
          <path d="M2 17h2"/>
          <path d="M2 7h2"/>
          <path d="M20 12h2"/>
          <path d="M20 17h2"/>
          <path d="M20 7h2"/>
          <path d="M7 20v2"/>
          <path d="M7 2v2"/>
          <rect x="4" y="4" width="16" height="16" rx="2"/>
          <rect x="8" y="8" width="8" height="8" rx="1"/>
        </svg>
        <div class="header-title header-title-row">
          <span class="header-brand">BIGMAC INDEX</span>
          <span class="header-tagline">Currency valuation vs USD</span>
        </div>
      </div>
      <div class="header-controls">
        <div class="year-control">
          <label for="year-slider" class="year-label">Year</label>
          <input type="range" id="year-slider" min="0" max="25" value="25" step="1">
          <span id="year-display" class="year-value">2025</span>
        </div>
        <button data-theme-toggle aria-label="Switch to light mode" class="theme-toggle">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        </button>
      </div>
    </header>

    <!-- Main content -->
    <main class="main">
      <!-- Map area -->
      <div class="map-container">
        <div id="map"></div>
        <div class="legend" id="legend"></div>
        <div id="tooltip" class="tooltip"></div>
      </div>

      <!-- Side panel -->
      <aside class="side-panel" id="side-panel">
        <div class="panel-tabs">
          <button class="tab active" data-tab="table">Countries</button>
          <button class="tab" data-tab="trend">Trend</button>
        </div>
        <div class="panel-content">
          <div id="table-view" class="tab-content active">
            <div class="table-wrapper">
              <table id="country-table">
                <thead>
                  <tr>
                    <th data-sort="name" class="sortable active-sort">Country <span class="sort-arrow">▲</span></th>
                    <th data-sort="dp" class="sortable num">USD Price <span class="sort-arrow"></span></th>
                    <th data-sort="usd" class="sortable num">Valuation <span class="sort-arrow"></span></th>
                  </tr>
                </thead>
                <tbody id="table-body"></tbody>
              </table>
            </div>
          </div>
          <div id="trend-view" class="tab-content">
            <div id="trend-header">
              <p class="trend-hint">Select a country from the map or table</p>
            </div>
            <div id="trend-chart"></div>
          </div>
        </div>
      </aside>
    </main>
  </div>

  <script src="./app.js"></script>
</body>
</html>
