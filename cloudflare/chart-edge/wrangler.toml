name = "axe-chart-edge"
main = "src/worker.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# Public env (non-secret). Set secrets via:
#   npx wrangler secret put CHART_SESSION_JWT_SECRET
#   npx wrangler secret put METAAPI_TOKEN
#   npx wrangler secret put STREAMER_SECRET   # only if you wire a Node streamer
[vars]
ALLOWED_ORIGINS = ""
METAAPI_CLIENT_API_URL = "https://mt-client-api-vzsrmwxzqcwfarnn.london.agiliumtrade.ai"
METAAPI_MARKET_DATA_URL = "https://mt-market-data-client-api-v1.london.agiliumtrade.ai"
# "poll" (default) → DO polls MetaApi REST itself.
# "push"            → DO uses WebSocket Hibernation API and only fans out
#                     events from /internal/publish (Node streamer required).
WORKER_MODE = "push"

[[durable_objects.bindings]]
name = "CHART_LIVE_ROOM"
class_name = "ChartLiveRoom"

[[migrations]]
tag = "v1"
new_classes = ["ChartLiveRoom"]
