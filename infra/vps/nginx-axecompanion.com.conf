# AXE Companion — Next.js on :5000, moved off Vercel after the deployment was
# disabled over billing (HTTP 402). Cloudflare Workers was tried first and hit
# the free plan ceiling: 3 MiB, against a 5.7 MB gzipped bundle. This box was
# already paid for and idle.
server {
    listen 80;
    listen [::]:80;
    server_name axecompanion.com www.axecompanion.com;

    # Certbot needs this reachable over plain HTTP before a cert exists.
    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name axecompanion.com www.axecompanion.com;

    # Placeholders until certbot issues the real pair; nginx will not start
    # without a certificate, and the API cert is valid to load even though it
    # is for another name.
    ssl_certificate     /etc/letsencrypt/live/api.axecompanion.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.axecompanion.com/privkey.pem;

    # Next serves its own compression and immutable asset headers; proxying
    # verbatim keeps that intact.
    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
